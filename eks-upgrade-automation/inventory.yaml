# EKS Cluster Inventory
# Each cluster specifies its AWS CLI profile for cross-account access.
# env: NonProd or Prod

defaults:
  timeout: 3600
  poll_interval: 30

clusters:
  # ── NonProd ─────────────────────────────────────────────
  - name: eks-dev-test
    region: us-east-1
    profile: EKS-account1
    env: NonProd



  # ── Prod ────────────────────────────────────────────────



  - name: prod01
    region: us-east-1
    profile: EKS-account2
    env: Prod



    
    


    

    